<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zymovo | Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav-logo">Zymovo</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="platform.html">Platform</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <section class="section container">
            <div class="contact-content">
                <h1>Contact Us</h1>
                <p>We'd love to hear from you. Whether you have a question about our research, platform, or potential collaborations, please don't hesitate to get in touch.</p>
                
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn submit-btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content container">
            <a href="index.html" class="footer-logo">Zymovo</a>
            <div class="footer-contact">
                <p>Contact person: 达菲鸡</p>
                <p>Email: <a href="mailto:info@Zymovo.com">info@Zymovo.com</a></p>
            </div>
        </div>
    </footer>
</body>
</html>
